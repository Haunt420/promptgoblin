name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
          cache-disabled: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Generate App Launcher Icons
        run: node scripts/generate-icons.js

      - name: Setup Gradle Wrapper in Android Project
        run: |
          cd android
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew

      - name: Sync Capacitor Web Assets to Android
        run: npx cap sync android

      - name: Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Move and Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/kenzen-cockpit-perchance.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenzen-cockpit-perchance-apk
          path: build-output/kenzen-cockpit-perchance.apk
          retention-days: 30

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/kenzen-cockpit-perchance.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
